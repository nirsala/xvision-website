name: Monthly GEO refresh

on:
  schedule:
    - cron: '0 5 1 * *'   # 1st of every month, 05:00 UTC (~08:00 IL)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump dateModified on GEO pages
        id: bump
        run: |
          set +e
          python3 .github/scripts/geo_refresh.py
          code=$?
          if [ "$code" = "78" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" != "0" ]; then exit "$code"; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit & push
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "geo-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "GEO: monthly freshness refresh (dateModified)"
          git pull --rebase origin main
          git push

      # urlList comes from geo_refresh.py, so every page it actually refreshed
      # gets submitted — not just one hardcoded URL.
      - name: Ping IndexNow
        if: steps.bump.outputs.changed == 'true'
        env:
          URLS: ${{ steps.bump.outputs.urls }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request

          urls = json.loads(os.environ["URLS"])
          for u in urls:
              print("submitting:", u)

          payload = {
              "host": "xvision.co.il",
              "key": "xvision-indexnow-2026",
              "keyLocation": "https://xvision.co.il/xvision-indexnow-2026.txt",
              "urlList": urls,
          }
          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST")
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"IndexNow HTTP {r.status} — submitted {len(urls)} URL(s)")
          except Exception as e:
              # Never fail the refresh because a search-engine ping failed.
              print("IndexNow submission failed:", e, file=sys.stderr)
          PY
