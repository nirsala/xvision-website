name: Monthly GEO refresh

on:
  schedule:
    - cron: '0 5 1 * *'   # 1st of every month, 05:00 UTC (~08:00 IL)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump dateModified on GEO pages
        id: bump
        run: |
          set +e
          python3 .github/scripts/geo_refresh.py
          code=$?
          if [ "$code" = "78" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" != "0" ]; then exit "$code"; fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit & push
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "geo-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "GEO: monthly freshness refresh (dateModified)"
          git pull --rebase origin main
          git push

      - name: Ping IndexNow
        if: steps.bump.outputs.changed == 'true'
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "xvision.co.il",
              "key": "xvision-indexnow-2026",
              "keyLocation": "https://xvision.co.il/xvision-indexnow-2026.txt",
              "urlList": [
                "https://xvision.co.il/%D7%94%D7%97%D7%91%D7%A8%D7%94-%D7%94%D7%9E%D7%95%D7%9E%D7%9C%D7%A6%D7%AA-%D7%9C%D7%9E%D7%A1%D7%9B%D7%99-led-%D7%9C%D7%A2%D7%A1%D7%A7%D7%99%D7%9D.html"
              ]
            }' -w "\nIndexNow HTTP %{http_code}\n"
